# Blackbox Exporter, reached only by PSSST and not scraped: PSSST already
# exports what it measures.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pssst-blackbox
  labels:
    app.kubernetes.io/name: pssst-blackbox
    app.kubernetes.io/component: prober
    {{- include "pssst.helmLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pssst-blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pssst-blackbox
        app.kubernetes.io/component: prober
      annotations:
        checksum/config: {{ .Files.Get "files/blackbox.yml" | sha256sum }}
        ad.datadoghq.com/blackbox.checks: '{}'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox
          image: "{{ .Values.blackbox.image.repository }}:{{ .Values.blackbox.image.tag }}"
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.blackbox.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pssst-blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: pssst-blackbox
  labels:
    app.kubernetes.io/name: pssst-blackbox
    {{- include "pssst.helmLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pssst-blackbox
  ports:
    - name: http
      port: 9115
      targetPort: http
      protocol: TCP
