{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pssst
  labels:
    app.kubernetes.io/name: pssst
    {{- include "pssst.helmLabels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pssst
  endpoints:
    # The Operator labels each target endpoint="metrics". Without honorLabels
    # the exporter's own endpoint label becomes exported_endpoint, and the
    # rules' per-endpoint freshness joins let a fresh probe vouch for a stale
    # one. The exporter sets no job, instance or Kubernetes label to override.
    - port: metrics
      honorLabels: true
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
