apiVersion: apps/v1
kind: Deployment
metadata:
  name: pssst
  labels:
    app.kubernetes.io/name: pssst
    app.kubernetes.io/component: exporter
    {{- include "pssst.helmLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pssst
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pssst
        app.kubernetes.io/component: exporter
      annotations:
        # Changing the inventory rolls the pods, as the kustomize base's
        # content-hashed ConfigMap name does.
        checksum/config: {{ include "pssst.inventory" . | sha256sum }}
        # Datadog Autodiscovery; see datadog.metrics in values.yaml.
        # tag_by_endpoint is off: by default the check tags every series with
        # its scrape URL, which carries the pod IP (a new set of series on each
        # reschedule) and collides with PSSST's own endpoint label.
        ad.datadoghq.com/pssst.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:9099/metrics",
                  "namespace": "pssst",
                  "tag_by_endpoint": false,
                  "max_returned_metrics": 10000,
                  "metrics": {{ toJson .Values.datadog.metrics }}
                }
              ]
            }
          }
        prometheus.io/scrape: "true"
        prometheus.io/port: "9099"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pssst
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/pssst/config.yml"]
          env:
            - name: PSSST_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: metrics
              containerPort: 9099
              protocol: TCP
          # Liveness only asks whether the process still serves HTTP. Readiness
          # waits for every source and probe to have been tried once.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/pssst
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pssst-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pssst
  labels:
    app.kubernetes.io/name: pssst
    {{- include "pssst.helmLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pssst
  ports:
    - name: metrics
      port: 9099
      targetPort: metrics
      protocol: TCP
