# The chart renders the same objects as the kustomize base in deploy/, under
# the same fixed names (pssst, pssst-blackbox), so the inventory's
# blackbox.base_url is http://pssst-blackbox:9115 either way. Install it once
# per namespace. deploy/deploy_test.go fails when the two drift apart.

image:
  repository: ghcr.io/adeleglise/pssst
  # Empty means the chart's appVersion: X.Y.Z for a released chart.
  tag: ""
  pullPolicy: IfNotPresent

# Your inventory, as YAML text. Empty ships the default inventory of 24
# European providers. Pass yours with:
#   helm install pssst ... --set-file inventory=inventory.yml
inventory: ""

logLevel: info

# Extra environment for the exporter, rendered after PSSST_LOG_LEVEL. The
# inventory reads ${NAME} in header values, so a token stays out of the file:
#   envFrom:
#     - secretRef:
#         name: pssst-tokens
extraEnv: []
envFrom: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

blackbox:
  image:
    repository: quay.io/prometheus/blackbox-exporter
    tag: v0.28.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi

# For a cluster running the Prometheus Operator. Off by default so the chart
# installs where the ServiceMonitor CRD does not exist. Without it, the pod's
# prometheus.io/* annotations serve an annotation-based Prometheus.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Labels your Prometheus selects on; kube-prometheus-stack ignores a
  # ServiceMonitor without release: <its release name> by default.
  additionalLabels: {}

# The correlation rules as a PrometheusRule, copied from deploy/prometheus/
# pssst.yml of the same release. Off by default for the same reason as the
# ServiceMonitor: the CRD may not exist.
prometheusRule:
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  additionalLabels: {}

# Blackbox Exporter probes any target it is asked for. This lets only PSSST's
# pods reach it (ingress on 9115, nothing else). Needs a CNI that enforces
# NetworkPolicy; others ignore the object.
networkPolicy:
  enabled: true

# Datadog Autodiscovery annotation. Custom metrics are billed per series, so
# the list is explicit and minimal; the README lists opt-in extras and their
# cost. A counter goes in without its _total suffix.
datadog:
  metrics:
    - psp_exporter_build_info
    - psp_status_source_fresh
    - psp_declared_operational
    - psp_active_incidents
    - psp_maintenance_active
    - psp_probe_fresh
    - psp_probe_success
