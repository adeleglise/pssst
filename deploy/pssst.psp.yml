# Real PSP inventory. Every endpoint here is a public production address and
# every component ID was verified against the live status page before being
# written down. No credential belongs in this file.
#
# Declared status uses the provider's own status page when it publishes a
# machine-readable one. A provider without one keeps type: none and is carried
# by the observed signal alone; that is an absent source, never a healthy one.
#
# Probe modules measure reachability, not authorization: a payment API that
# answers 401 or 404 on its root is up. Only a transport failure is a failure.

server:
  listen_address: ":9099"

polling:
  # Status pages change slowly and are shared infrastructure; poll them gently.
  status_interval: 300s
  probe_interval: 60s
  timeout: 15s
  jitter: 30s

blackbox:
  base_url: "http://pssst-blackbox:9115"

psps:
