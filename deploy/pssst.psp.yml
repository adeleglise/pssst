    display_name: Payplug
    kind: psp
    status:
      type: statuspage_v2
      base_url: "https://status.payplug.com"
      components:
        ecommerce_payments: mychm038gxsp
        settlement: qqt0g2qq543n
        alternative_methods: 30zws7fks013
    probes:
      - id: api_https
        module: http_api_reachable
        target: "https://api.payplug.com/"
      - id: api_tls
        module: tls_connect
        target: "api.payplug.com:443"

