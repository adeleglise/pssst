# Production stack for the NAS. It carries only the exporter and its own
# Blackbox instance; metrics are scraped by the Prometheus already running
# there, which owns retention, rules and alerting.
#
#   NAS Prometheus ──scrape──> pssst:9099 ──/probe──> pssst-blackbox:9115
#                                   │                        │
#                                   └──status pages          └──PSP endpoints
#
# Both services join monitoring_default, the network that Prometheus runs on,
# and publish no port: Prometheus reaches the exporter by service name.
#
# The images carry their configuration (Dockerfile targets exporter-nas and
# blackbox-nas), so the stack needs no bind mount and an inventory change
# ships as a new image tag. No registry serves them: they are built on a
# workstation and loaded into the NAS engine, see "The NAS" in AGENTS.md.
#
#   podman build --platform linux/amd64 --target exporter-nas --build-arg VERSION=1.0.0 -t localhost/pssst-nas:1.0.0 .
#   podman build --platform linux/amd64 --target blackbox-nas -t localhost/pssst-blackbox-nas:1.0.0 .
name: pssst

services:
  pssst:
    image: ${PSSST_IMAGE:-localhost/pssst-nas:1.0.0}
    restart: unless-stopped
    depends_on:
      - pssst-blackbox
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    networks: [monitoring]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pssst-blackbox:
    image: ${PSSST_BLACKBOX_IMAGE:-localhost/pssst-blackbox-nas:1.0.0}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    external: true
    name: monitoring_default
