# Production stack for the NAS. It carries only the exporter and its own
# Blackbox instance; metrics are scraped by the Prometheus already running
# there, which owns retention, rules and alerting.
#
#   NAS Prometheus ──scrape──> pssst:9099 ──/probe──> pssst-blackbox:9115
#                                   │                        │
#                                   └──status pages          └──PSP endpoints
#
# Both services join monitoring_default, the network that Prometheus runs on,
# and publish no port: Prometheus reaches the exporter by service name.
#
# Deployed as a Portainer Git repository stack with this file as its compose
# path. Portainer clones the branch and the images are built from it on every
# deployment (pull_policy: build), so "Pull and redeploy", or automatic updates
# polling the branch, always runs the latest commit. The images carry their
# configuration: an inventory change is a commit, never a file edited on the
# host. Portainer setup: Stacks > Add stack > Repository, this repository with
# a read-only token, reference refs/heads/main, compose path
# deploy/compose.nas.yml, GitOps updates on. Remove any previous "pssst" stack
# first: the project name is the same.
#
# PSSST_VERSION, set in the stack's environment variables, is what
# psp_exporter_build_info reports. The build context has no .git, so it
# cannot be derived from the checkout.
name: pssst

services:
  pssst:
    image: localhost/pssst-nas:latest
    build:
      context: ..
      target: exporter-nas
      args:
        VERSION: ${PSSST_VERSION:-dev}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - pssst-blackbox
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    networks: [monitoring]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pssst-blackbox:
    image: localhost/pssst-blackbox-nas:latest
    build:
      context: ..
      target: blackbox-nas
    pull_policy: build
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    external: true
    name: monitoring_default
