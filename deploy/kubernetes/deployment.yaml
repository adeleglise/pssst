apiVersion: apps/v1
kind: Deployment
metadata:
  name: pssst
  labels:
    app.kubernetes.io/name: pssst
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pssst
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pssst
        app.kubernetes.io/component: exporter
      annotations:
        # Datadog Autodiscovery. Custom metrics are billed per series, so the
        # list is explicit and minimal: what a monitor needs to tell declared
        # from observed status, about 300 series for the shipped inventory
        # instead of about 1000 for everything. The *_fresh gauges stand in for
        # the timestamps and thresholds, which Datadog cannot compare with the
        # current time. Opt-in extras and their cost are in the README.
        # tag_by_endpoint is off: by default the check tags every series with
        # its scrape URL, which carries the pod IP (a new set of series on each
        # reschedule) and collides with PSSST's own endpoint label.
        ad.datadoghq.com/pssst.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:9099/metrics",
                  "namespace": "pssst",
                  "tag_by_endpoint": false,
                  "max_returned_metrics": 10000,
                  "metrics": [
                    "psp_exporter_build_info",
                    "psp_status_source_fresh",
                    "psp_declared_operational",
                    "psp_active_incidents",
                    "psp_maintenance_active",
                    "psp_probe_fresh",
                    "psp_probe_success"
                  ]
                }
              ]
            }
          }
        # Prometheus without the operator picks the pod up from these.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9099"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pssst
          # Tag and registry come from the kustomization's images entry.
          image: pssst
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/pssst/config.yml"]
          env:
            - name: PSSST_LOG_LEVEL
              value: info
          ports:
            - name: metrics
              containerPort: 9099
              protocol: TCP
          # Liveness only asks whether the process still serves HTTP. Readiness
          # is the one that waits for every source and probe to have been tried
          # once, so a rolling update never sends scrapes to an empty cache.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # The first pass over every source and probe takes jitter plus one
          # interval, so startup gets its own budget instead of being mistaken
          # for a liveness failure.
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/pssst
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pssst-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pssst
  labels:
    app.kubernetes.io/name: pssst
spec:
  selector:
    app.kubernetes.io/name: pssst
  ports:
    - name: metrics
      port: 9099
      targetPort: metrics
      protocol: TCP
