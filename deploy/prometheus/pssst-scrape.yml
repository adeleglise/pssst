# Scrape job to merge into the existing Prometheus configuration on the NAS.
# Append this job to its scrape_configs list and add the rule file below to its
# rule_files list, then reload. Nothing else in that configuration changes.
#
#   rule_files:
#     - /etc/prometheus/pssst.rules.yml
#
# The exporter serves cached state, so a 30s scrape never waits on a provider.
# Keep the interval at or above the existing global default.

scrape_configs:
  - job_name: pssst
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      # The stack publishes the exporter on the NAS address. Prometheus runs in
      # a container, so a loopback-only publish would be unreachable for it.
      - targets: ["192.168.1.250:9099"]
