# Scrape job for an existing Prometheus. Merge it into scrape_configs, and add
# pssst.yml (the recording rules and alerts) to rule_files:
#
#   rule_files:
#     - /etc/prometheus/rules/pssst.yml
#
# then reload Prometheus. The target is the exporter's address as Prometheus
# sees it: pssst:9099 when both share a Docker network (deploy/compose.yml),
# a host:port otherwise. On Kubernetes, use the ServiceMonitor or the pod
# annotations instead (deploy/kubernetes/).
#
# A scrape only reads the exporter's cache and never waits on a provider, so
# the default timeout is plenty.

scrape_configs:
  - job_name: pssst
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["pssst:9099"]
