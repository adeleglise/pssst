apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The kustomization sits here, not under kubernetes/, because kustomize refuses
# to read files outside its own directory. That constraint is welcome: the
# inventory stays the single source of truth and is generated into a ConfigMap
# rather than copied. An overlay replaces it with its own inventory; see the
# README.
#
# The generated names carry a content hash, so changing the inventory rolls the
# pods instead of leaving them on a stale mount.
configMapGenerator:
  - name: pssst-config
    files:
      - config.yml=pssst.psp.yml
  - name: pssst-blackbox-config
    files:
      - blackbox.yml=blackbox/blackbox.yml

# Published by the image workflow for linux/amd64 and linux/arm64. Pin a
# release tag in production; "edge" follows main.
images:
  - name: pssst
    newName: ghcr.io/adeleglise/pssst
    newTag: edge

resources:
  - kubernetes/deployment.yaml
  - kubernetes/blackbox.yaml
  - kubernetes/servicemonitor.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: pssst
    includeSelectors: false
