<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <title>PSSST: declared and observed status of your payment providers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#16263D"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g transform="translate(72 64) scale(0.375)">
    <rect width="512" height="512" rx="112" fill="#0B1522"/>
    <path d="M168 112H344A72 72 0 0 1 416 184V280A72 72 0 0 1 344 352H236L150 420L166 352A72 72 0 0 1 96 280V184A72 72 0 0 1 168 112Z"
