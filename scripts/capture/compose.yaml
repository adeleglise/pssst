# Layered on the demo's compose.yaml by scripts/capture-dashboard.sh: three
# more fictional providers, a Grafana, and the capture inventory.
services:
  psp_exporter:
    volumes:
      - ./scripts/capture/pssst.yml:/etc/pssst/config.yml:ro

  fake_contoso: &fake
    image: localhost/pssst-fake:dev
    # Built by fake_psp in compose.yaml; never pulled.
    pull_policy: never
    ports:
      - "127.0.0.1:${PSSST_CONTOSO_PORT:-38081}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  fake_fabrikam:
    <<: *fake
    ports:
      - "127.0.0.1:${PSSST_FABRIKAM_PORT:-38082}:8080"

  fake_tailspin:
    <<: *fake
    ports:
      - "127.0.0.1:${PSSST_TAILSPIN_PORT:-38083}:8080"

  grafana:
    image: docker.io/grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${PSSST_GRAFANA_PORT:-33000}:3000"
    depends_on: [prometheus]
