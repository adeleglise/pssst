# Weekly, grouped, so an update arrives as one reviewable PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile: Go builder and Blackbox.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  # Blackbox and Prometheus images in compose.yaml. This configuration does not
  # scan the Kubernetes manifests or the Helm values: deploy/deploy_test.go
  # keeps the Blackbox reference identical in all five places. The images built
  # locally by the demo stack are not on a registry.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "localhost/*"
    groups:
      compose-images:
        patterns: ["*"]
