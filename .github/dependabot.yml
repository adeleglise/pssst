# Weekly, grouped, so an update arrives as one reviewable PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile: Go builder and Blackbox.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  # Blackbox and Prometheus images in compose.yaml. Kubernetes manifests and
  # Helm values are not scanned by Dependabot: deploy/deploy_test.go keeps the
  # Blackbox reference identical in all four places.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
