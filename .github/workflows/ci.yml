name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v3.14.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # fmt-check lists sources with ripgrep, absent from the runner image.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      # The chart is compared with the kustomize base by go test; kubectl,
      # preinstalled on the runner, provides kustomize. Without the variable a
      # missing tool would skip the comparison instead of failing it.
      - run: make fmt-check lint vuln test test-race build chart-test
        env:
          PSSST_REQUIRE_DEPLOY_TOOLS: "1"
      - name: Generated dashboards are up to date
        run: make dashboards && git diff --exit-code deploy/grafana
      - name: Validate Prometheus rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace "$PROMETHEUS_IMAGE" check rules deploy/prometheus/pssst.yml
          docker run --rm --entrypoint /bin/promtool -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace "$PROMETHEUS_IMAGE" test rules deploy/prometheus/pssst-rules-test.yml

  # Real containers, real Prometheus, synthetic provider: the only check that
  # proves both signals reach the recording rules independently.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make smoke RUNTIME=docker
